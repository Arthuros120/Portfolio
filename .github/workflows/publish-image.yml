# Builds the static site and publishes a versioned image to GHCR.
# workflow_dispatch only: a push or a pull request does not publish anything.
# Arthur runs this from the Actions tab when he wants a package.

name: publish-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, such as 1.2.3 or v1.2.3. latest is refused.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --verbose

      - name: Refuse a latest-only tag
        id: version
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing tag. Pass a semantic version such as 1.2.3. The tag latest is not allowed."
            exit 1
          fi
          echo "version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=portfolio
